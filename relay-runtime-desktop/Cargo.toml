[package]
name = "relay-runtime-desktop"
version = "0.1.0"
edition = "2021"
description = "Skia/winit desktop renderer for relay-runtime VNodes"
license = "MIT OR Apache-2.0"

[lib]
name = "relay_runtime_desktop"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
relay-runtime = { path = "../../relay-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
taffy = "0.6"
winit = "0.30"
tiny-skia = "0.11"
ab_glyph = "0.2"
softbuffer = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
